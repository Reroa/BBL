<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Baseball 3D Prototype</title>
  <style>
    html, body, #app { width:100%; height:100%; margin:0; overflow:hidden; background:#0b1220; }
    body { font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; touch-action:none; }
    canvas { display:block; width:100%; height:100%; }
    #hud { position:absolute; inset:0; pointer-events:none; color:white; }
    .top { position:absolute; top:14px; left:14px; right:14px; display:flex; justify-content:space-between; gap:12px; }
    .panel { background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.15); backdrop-filter:blur(8px);
      border-radius:14px; padding:10px 14px; font-weight:700; }
    #message { position:absolute; top:14%; left:50%; transform:translateX(-50%); font-size:clamp(22px,5vw,44px);
      font-weight:900; text-shadow:0 3px 10px #000; text-align:center; min-width:260px; }
    #swing { pointer-events:auto; position:absolute; right:18px; bottom:18px; width:110px; height:110px;
      border-radius:50%; border:3px solid rgba(255,255,255,.85); background:rgba(210,48,48,.9); color:white;
      font-weight:900; font-size:22px; box-shadow:0 8px 22px rgba(0,0,0,.4); }
    #pitch { pointer-events:auto; position:absolute; left:18px; bottom:18px; min-width:110px; height:56px;
      border-radius:14px; border:1px solid rgba(255,255,255,.4); background:rgba(26,72,120,.9); color:white;
      font-weight:800; font-size:17px; padding:0 18px; }
    #hint { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); opacity:.8; font-size:13px; text-align:center; }
    @media(max-width:560px){ #hint{display:none} .panel{font-size:13px;padding:8px 10px} #swing{width:94px;height:94px} }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div class="top">
      <div class="panel" id="count">PITCH 0 · HIT 0</div>
      <div class="panel" id="speed">92 mph</div>
    </div>
    <div id="message">PITCH 버튼으로 시작</div>
    <button id="pitch">PITCH</button>
    <button id="swing">SWING</button>
    <div id="hint">SPACE = 스윙 · R = 새 투구</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
